name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and development tools
        run: python -m pip install --upgrade pip && python -m pip install --editable ".[dev]"

      - name: Check dependencies
        run: python -m pip check

      - name: Lint
        run: python -m ruff check .

      - name: Test
        run: python -m pytest

      - name: Check command-line entry point
        run: python -m financial_statement_extract --help

      - name: Build distributions
        run: python -m build

      - name: Smoke test built wheel
        shell: pwsh
        run: |
          $wheel = Get-ChildItem dist/*.whl | Select-Object -First 1
          python -m pip install --force-reinstall --no-deps $wheel.FullName
          python -c "import financial_statement_extract; print(financial_statement_extract.__version__)"
          python -m financial_statement_extract --help
