name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # Bootstrap trust before package-index access: https://discuss.python.org/t/109576
      - name: Bootstrap pip with verified certificates
        run: >-
          python -m pip --isolated --disable-pip-version-check --no-cache-dir install --no-index --no-deps --upgrade
          "pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70"

      - name: Update packaging and certificate bundle
        run: python -m pip install --upgrade "pip>=26.2.2" "certifi>=2026.10.19"

      - name: Install project and development tools
        run: python -m pip install --editable ".[dev]"

      - name: Check dependencies
        run: python -m pip check

      - name: Lint
        run: python -m ruff check .

      - name: Test
        run: python -m pytest

      - name: Check command-line entry point
        run: python -m financial_statement_extract --help

      - name: Build distributions
        run: python -m build

      - name: Smoke test built wheel
        shell: pwsh
        run: |
          $wheel = Get-ChildItem dist/*.whl | Select-Object -First 1
          python -m pip install --force-reinstall --no-deps $wheel.FullName
          python -c "import financial_statement_extract; print(financial_statement_extract.__version__)"
          python -m financial_statement_extract --help
